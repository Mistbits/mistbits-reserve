version: 2
updates:
  - package-ecosystem: npm
    schedule:
      interval: daily
      time: 06:00
      timezone: Africa/Johannesburg
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
